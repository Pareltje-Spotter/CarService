name: OWASP ZAP Scan

on: [push]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t niels040/pareltje-spotter:latest-userservice .
      - name: Create Custom Network
        run: docker network create zap-net

      - name: Start Application in Custom Network
        run: docker run -d -p 8080:8080 --network=zap-net --name pareltje-car niels040/pareltje-spotter:latest-userservice

      - name: ZAP Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://pareltje-car:8080'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          extra_docker_args: '--network=zap-net'
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop Application
        run: |
          docker stop pareltje-car
          docker rm pareltje-car
      - name: Remove Custom Network
        run: docker network rm zap-net